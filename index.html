<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>KIRO</title>
<style>
:root{--b:#00ff41}
*{margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;color:var(--b);font-family:'Courier New',monospace;overflow:hidden}
canvas{position:absolute;top:0;left:0;z-index:1;opacity:0.3;pointer-events:none}
.ui{position:relative;z-index:99;width:100%;height:100dvh;padding:15px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;background:rgba(0,0,0,0.4)}
.h{font-size:0.7rem;letter-spacing:3px;text-shadow:0 0 5px var(--b)}
.s{border:1px solid var(--b);padding:8px 15px;background:rgba(0,20,0,0.7);font-size:0.8rem;font-weight:bold;letter-spacing:1px;box-shadow:0 0 10px rgba(0,255,65,0.3)}
.c{width:100%;height:100px;background:rgba(0,0,0,0.85);border-left:2px solid var(--b);padding:8px;font-size:0.7rem;color:#fff;overflow-y:auto;line-height:1.3}
.c .a{color:var(--b);text-shadow:0 0 3px var(--b)}
#b{width:100%;padding:16px;background:transparent;color:var(--b);border:2px solid var(--b);font-size:1rem;font-weight:bold;letter-spacing:3px;cursor:pointer;text-transform:uppercase;z-index:999}
#b:active{background:var(--b);color:#000}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="ui">
<div class="h">[ KIRO v6.2 ]</div>
<div class="s" id="st">SIGNAL_STDBY</div>
<div class="c" id="lg"><span class="a">[SYS]> </span>Tap tombol, ngomong, Kiro jawab.</div>
<button id="b">ENTER & NGOMONG</button>
</div>
<script>
// Matrix rain
var cv=document.getElementById('cv'),cx=cv.getContext('2d');
cv.width=innerWidth;cv.height=innerHeight;
var ch='アイウエオ0123456789XYZ',fs=10,cc=cv.width/fs,d=[];
for(var i=0;i<cc;i++)d[i]=1;
setInterval(function(){
 cx.fillStyle='rgba(0,0,0,0.05)';cx.fillRect(0,0,cv.width,cv.height);
 cx.fillStyle='#0f0';cx.font=fs+'px monospace';
 for(var i=0;i<d.length;i++){cx.fillText(ch[Math.floor(Math.random()*ch.length)],i*fs,d[i]*fs);if(d[i]*fs>cv.height&&Math.random()>0.975)d[i]=0;d[i]++}
},30);

var st=document.getElementById('st'),lg=document.getElementById('lg'),b=document.getElementById('b');
var KEY='sk-e6063277741f42f7a3df40a2896de212';
var URL='https://api.deepseek.com/v1/chat/completions';
var SYS='Kamu Kiro, asisten Bang Giri. Panggil Bang. Jawab singkat hangat. JANGAN pake emoji.';
var busy=0,rec=null,micReady=0;
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;

function log(m){lg.innerHTML+='<br><span class="a">[SYS]></span> '+m;lg.scrollTop=lg.scrollHeight;}
function you(m){lg.innerHTML+='<br><span class="a">[YOU]></span> '+m;lg.scrollTop=lg.scrollHeight;}
function ai(m){lg.innerHTML+='<br><span class="a">[AI]></span> '+m;lg.scrollTop=lg.scrollHeight;}
function face(s,c){st.innerText=s;st.style.color=c;st.style.borderColor=c;}

async function sendAPI(t){
 try{
  var r=await fetch(URL,{
   method:'POST',
   headers:{'Content-Type':'application/json','Authorization':'Bearer '+KEY},
   body:JSON.stringify({model:'deepseek-chat',messages:[{role:'system',content:SYS},{role:'user',content:t}],max_tokens:300})
  });
  var d=await r.json();
  return d.choices&&d.choices[0]?d.choices[0].message.content:'Error';
 }catch(e){log('API err: '+e.message);return 'Jalur error';}
}

function speak(t){
 var ct=t.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu,'').replace(/[_#*`\n\r]/g,' ');
 if(!ct.trim())ct='Tidak ada respon.';
 var u=new SpeechSynthesisUtterance(ct);
 u.lang='id-ID';
 u.onend=function(){busy=0;face('SIAP','#0f0');};
 window.speechSynthesis.speak(u);
}

function startRec(){
 if(!SR){log('Browser gak support voice');return;}
 rec=new SR();
 rec.continuous=false;rec.interimResults=false;rec.lang='id-ID';
 rec.onresult=function(e){
  var t=e.results[e.results.length-1][0].transcript;
  if(t.trim()&&!busy){
   busy=1;
   face('MIKIR...','#ffcc00');
   you(t);
   if(rec)rec.stop();
   sendAPI(t).then(function(reply){
    ai(reply);
    face('KIRO BICARA','#00ffff');
    speak(reply);
   });
  }
 };
 rec.onerror=function(e){
  if(e.error!='no-speech'&&e.error!='aborted')log('Voice err: '+e.error);
  if(!busy)face('SIGNAL_STDBY','#0f0');
 };
 rec.onend=function(){
  if(!busy)face('SIGNAL_STDBY','#0f0');
 };
 rec.start();
 face('DENGAR...','#ff0');
}

b.onclick=function(){
 if(busy)return;
 if(!micReady){
  // Izin mic via getUserMedia dulu (khusus iOS)
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
   micReady=1;
   log('Mic ok');
   startRec();
  }).catch(function(e){
   log('Izin mic ditolak: '+e.message);
  });
 }else{
  startRec();
 }
};

window.onerror=function(m,s,l,c,e){log('Err: '+(m||''));return true};
</script>
</body>
</html>
