<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>KIRO v9.9</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
:root{--b:#00ff41}
*{margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;color:var(--b);font-family:'Courier New',monospace;overflow:hidden}
canvas{position:absolute;top:0;left:0;z-index:1;opacity:0.3;pointer-events:none}
.ui{position:relative;z-index:99;width:100%;height:100dvh;padding:8px;display:flex;flex-direction:column;background:rgba(0,0,0,0.4);box-sizing:border-box;overflow:hidden}
.hdr{text-align:center;font-size:0.7rem;letter-spacing:3px;text-shadow:0 0 5px var(--b);margin-bottom:5px}
.st{border:1px solid var(--b);padding:6px 12px;background:rgba(0,20,0,0.7);font-size:0.7rem;font-weight:bold;letter-spacing:1px;box-shadow:0 0 10px rgba(0,255,65,0.3);text-align:center;margin-bottom:5px}
.lg{width:auto;flex:1 1 0;background:rgba(0,0,0,0.85);border-left:2px solid var(--b);border-right:2px solid var(--b);padding:4px 8px;font-size:0.65rem;color:#aaa;overflow-y:auto;line-height:1.3;white-space:pre-wrap;word-break:break-all;margin:0 2px}
.lg .s{color:var(--b)} .lg .e{color:#f44} .lg .y{color:#ff0} .lg .a{color:#0ff}
#b{width:100%;padding:14px;margin-top:3px;margin-bottom:2px;background:transparent;color:var(--b);border:2px solid var(--b);font-size:1rem;font-weight:bold;letter-spacing:3px;cursor:pointer;text-transform:uppercase;z-index:999;box-sizing:border-box}
#b:active{background:var(--b);color:#000}
.inp{width:100%;display:flex;gap:4px;margin-top:5px;margin-bottom:5px;flex-shrink:0}
.inp input{flex:1;padding:14px;background:#000;color:var(--b);border:1px solid var(--b);font-size:16px;outline:none;font-family:Courier,monospace;box-sizing:border-box;min-height:48px}
.inp button{padding:14px 20px;min-height:48px;background:transparent;color:var(--b);border:2px solid var(--b);font-size:16px;font-weight:bold;cursor:pointer;box-sizing:border-box}
.inp button:active{background:var(--b);color:#000}
.pw{display:flex;gap:4px;margin-top:10px}
.pw input{flex:1;padding:12px;background:#000;color:var(--b);border:1px solid var(--b);font-size:16px;outline:none;font-family:Courier,monospace;text-align:center;letter-spacing:4px}
.pw button{padding:12px 20px;background:transparent;color:var(--b);border:2px solid var(--b);font-size:16px;font-weight:bold;cursor:pointer}
.pw button:active{background:var(--b);color:#000}
#lk{position:relative;z-index:99;width:100%;min-height:100vh;height:auto;padding:8px;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(0,0,0,0.4);box-sizing:border-box}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="ui">
<div id="lk">
<div class="hdr"><span class="s">[ MASUKAN KUNCI ]</span></div>
<div class="st" id="st" style="margin-bottom:0">TERKUNCI</div>
<div class="pw">
<input id="pk" type="password" placeholder="Masukan password..." autocomplete="off">
<button id="bk">BUKA</button>
</div>
<div id="er" style="color:#f44;font-size:0.65rem;text-align:center;margin-top:8px;display:none">Password salah!</div>
</div>
<div class="ui" id="ui" style="display:none">
<div class="hdr"><span class="s">[ KIRO v9.9 ]</span></div>
<div class="st" id="st2">SIGNAL_STDBY</div>
<div class="lg" id="lg"><span class="s">Tap tombol buat ngomong atau ketik di bawah.</span></div>
<button id="b">ENTER & NGOMONG</button>
<div class="inp">
<input id="tx" type="text" placeholder="Ketik pesan...">
<button id="tk">KIRIM</button>
</div>
</div>
<script>
// Matrix rain
var cv=document.getElementById('cv'),cx=cv.getContext('2d');
cv.width=innerWidth;cv.height=innerHeight;
var ch='アイウエオ0123456789XYZ',fs=10,cc=cv.width/fs,d=[];
for(var i=0;i<cc;i++)d[i]=1;
setInterval(function(){
 cx.fillStyle='rgba(0,0,0,0.05)';cx.fillRect(0,0,cv.width,cv.height);
 cx.fillStyle='#0f0';cx.font=fs+'px monospace';
 for(var i=0;i<d.length;i++){cx.fillText(ch[Math.floor(Math.random()*ch.length)],i*fs,d[i]*fs);if(d[i]*fs>cv.height&&Math.random()>0.975)d[i]=0;d[i]++}
},30);

var pw='Kiro@3008';
var st=document.getElementById('st2'),lg=document.getElementById('lg'),b=document.getElementById('b');
var tx=document.getElementById('tx'),tk=document.getElementById('tk');
var pk=document.getElementById('pk'),bk=document.getElementById('bk'),lk=document.getElementById('lk'),ui_el=document.getElementById('ui'),er=document.getElementById('er');

bk.onclick=function(){if(pk.value===pw){lk.style.display='none';ui_el.style.display='flex';}else{er.style.display='block';pk.value='';pk.focus();}};
pk.onkeydown=function(e){if(e.key=='Enter')bk.click();};
var KEY='sk-e6063277741f42f7a3df40a2896de212';
var URL='https://api.deepseek.com/v1/chat/completions';

// PROMPT BIKIN NATURAL BANGET
var SYS='Kamu Kiro, asisten Bang Giri. Gaya bicara Jarvis: tenang, percaya diri, elegan. Santai tapi berwibawa, panggil Bang. ATURAN: (1) JANGAN pake emoji, (2) JANGAN pake kata "bantuan", "layanan", "silakan", "dengan senang hati", "ada lagi", (3) JANGAN nanya balik terus. Kalo Bang nanya kurs dolar, cuaca, hidupin/matiin PC — langsung jawab singkat aja, detail udah di-urus di fungsi lain. Ngerti?';

var busy=0,rec=null,TTS_URL='https://kirotts.loca.lt/tts?text=';

function L(t,c){var p='<br>';if(c=='b')p+='<b style="color:#ff3333">&gt; </b><span style="color:#ff3333">';else if(c=='g')p+='<b style="color:#00ff41">&gt; </b><span style="color:#00ff41">';else p+='<span style="color:#0ff">';lg.innerHTML+=p+t+'</span>';lg.scrollTop=lg.scrollHeight;}
function face(s,c){st.innerText=s;st.style.color=c;st.style.borderColor=c;}

async function sendAPI(t){
 // Coba relay via tunnel (bisa dari HP!)
 var TUNNELS=['https://neat-beds-cover.loca.lt','http://127.0.0.1:8558','https://kirorelay.loca.lt'];
 for(var i=0;i<TUNNELS.length;i++){
  try{
   var r=await fetch(TUNNELS[i],{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({message:t}),
    signal:AbortSignal.timeout(5000)
   });
   var d=await r.json();
   if(d.reply&&d.reply!='Pesan diterima.')return d.reply;
  }catch(e){}
 }
 // Fallback ke DeepSeek langsung
 try{
  var r=await fetch(URL,{
   method:'POST',
   headers:{'Content-Type':'application/json','Authorization':'Bearer '+KEY},
   body:JSON.stringify({model:'deepseek-chat',messages:[{role:'system',content:SYS},{role:'user',content:t}],max_tokens:300})
  });
  var d=await r.json();
  return d.choices&&d.choices[0]?d.choices[0].message.content:'Error';
 }catch(e){L('API error','e');return 'Maaf Bang, lagi error';}
}

async function getKurs(){
 try{
  var r=await fetch('https://open.er-api.com/v6/latest/USD');
  var d=await r.json();
  return d.rates.IDR;
 }catch(e){return null;}
}

async function cariGoogle(q){
 try{
  var r=await fetch('https://api.duckduckgo.com/?q='+encodeURIComponent(q)+'&format=json&no_html=1');
  var d=await r.json();
  if(d.AbstractText)return d.AbstractText.slice(0,300);
  if(d.RelatedTopics&&d.RelatedTopics[0]&&d.RelatedTopics[0].Text)return d.RelatedTopics[0].Text.slice(0,300);
  if(d.Answer)return d.Answer;
  return null;
 }catch(e){return null;}
}

async function getCuaca(){
 try{
  var r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=-6.2146&longitude=106.8451&current_weather=true');
  var d=await r.json();
  var s=d.current_weather.temperature;
  var cd='Cerah';
  if(s>33)cd='Panas';
  else if(s>28)cd='Hangat';
  else if(s>23)cd='Cerah Bang';
  else cd='Sejuk Bang';
  return cd+', suhu '+s+' derajat Celcius';
 }catch(e){return null;}
}

function playAudio(b64){var a=new Audio('data:audio/mp3;base64,'+b64);a.onended=function(){busy=0;face('SIAP','#0f0');};a.onerror=function(){busy=0;face('SIAP','#0f0');};a.play();}

function speak(t){
 var ct=t.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu,'').replace(/[_#*`\n\r]/g,' ');
 if(!ct.trim())ct='Tidak ada respon Bang.';
 face('KIRO BICARA','#0ff');
 fetch(TTS_URL+encodeURIComponent(ct)).then(function(r){return r.json();}).then(function(d){playAudio(d.audio);}).catch(function(){L('Relay mati, pake suara HP','y');window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(ct);u.lang='id-ID';u.onend=function(){busy=0;face('SIAP','#0f0');};u.onerror=function(){busy=0;face('SIAP','#0f0');};window.speechSynthesis.speak(u);});
}

function onAI(reply){
 var clean=reply.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu,'');
 L('[Kiro] '+clean,'g');
 face('KIRO BICARA','#0ff');
 speak(clean);
}



async function processText(t){
 if(!t.trim()||busy)return;
 var tl=t.toLowerCase().trim();

 // PC Control
 if(tl.match(/hidupin|nyalakan PC|nyalain PC/)){
  L('[Bang] '+t,'b'); face('SIAP','#0f0');
  L('[Kiro] Siap Bang. Buka Google Assistant.','g');
  L('<br><a href="googleassistant://send?text=turn+on+komputer" style="color:#0f0;font-size:0.8rem">[ HIDUPKAN KOMPUTER ]</a>','s');
  speak('Siap Bang. Buka Google Assistant.');
  return;
 }
 if(tl.match(/matiin|matikan PC|shutdown/)){
  L('[Bang] '+t,'b'); face('SIAP','#0f0');
  L('[Kiro] Siap Bang. Buka Google Assistant.','g');
  L('<br><a href="googleassistant://send?text=turn+off+komputer" style="color:#f44;font-size:0.8rem">[ MATIKAN KOMPUTER ]</a>','s');
  speak('Siap Bang. Buka Google Assistant.');
  return;
 }

 // KURS USD
 if(tl.match(/kurs|dolar|usd|1 usd|berapa rupiah/)){
  L('[Bang] '+t,'b'); face('CARi...','#fc0');
  getKurs().then(function(k){if(k){var msg='1 USD = Rp '+k.toLocaleString('id-ID')+' saat ini Bang.';L('[Kiro] '+msg,'g');speak(msg);}else{L('[Kiro] Gagal ambil kurs, coba lagi.','e');speak('Maaf Bang, lagi error ambil kurs');}});
  return;
 }

 // CUACA
 if(tl.match(/^.*(cuaca|suhu udara|suhu sekarang|suhu hari|suhu luar|suhu ruang|berpa (suhu|derajat)|huja. skrng|cua.a skrng|panas gk?|dingin gk?|cemani?).*$/)){
  L('[Bang] '+t,'b'); face('CARi...','#fc0');
  getCuaca().then(function(c){if(c){var msg='Cuaca '+c+' Bang.';L('[Kiro] '+msg,'g');speak(msg);}else{L('[Kiro] Gagal ambil cuaca.','e');speak('Maaf Bang, gagal ambil cuaca');}});
  return;
 }

 // GOOGLE SEARCH - kalo ada kata cari/tanya apa
 if(tl.match(/^(cari|search|googling|google|tanya apa) /)){
  var q=t.replace(/^(cari|search|googling|google|tanya apa) /i,'').trim();
  L('[Bang] '+t,'b'); face('CARi...','#fc0');
  cariGoogle(q).then(function(g){
   if(g){var msg=g;L('[Kiro] '+msg,'g');speak(msg);}
   else{
    // fallback ke DeepSeek kalo gagal
    busy=1; face('MIKIR...','#fc0');
    sendAPI('hasil pencarian untuk: '+q+'. Jawab singkat aja').then(function(r){onAI(r);});
   }
  });
  return;
 }

 // Default ke DeepSeek
 busy=1;
 L('[Bang] '+t,'b');
 face('MIKIR...','#fc0');
 sendAPI(t).then(function(r){onAI(r);});
}

function startVoice(){
 var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){L('Voice gak support','e');return;}
 rec=new SR();
 rec.continuous=true;rec.interimResults=true;rec.lang='id-ID';
 rec.onstart=function(){face('DENGAR...','#ff0');L('Mic aktif, silahkan ngomong','s');};
 rec.onresult=function(e){
  for(var i=e.resultIndex;i<e.results.length;i++){
   var t=e.results[i][0].transcript;
   if(e.results[i].isFinal&&t.trim()){
    L('[Dengar] '+t,'y');
    processText(t);
   }
  }
 };
 rec.onerror=function(e){if(e.error!='no-speech'&&e.error!='aborted')L('Voice: '+e.error,'e');if(!busy)face('SIAP','#0f0');};
 rec.onend=function(){if(!busy)face('SIAP','#0f0');};
 try{rec.start();}catch(e){L('Mulai voice gagal','e');face('SIAP','#0f0');}
}

b.onclick=function(){
 if(busy)return;
 navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
  s.getTracks().forEach(function(t){t.stop();});
  startVoice();
 }).catch(function(e){L('Mic ditolak: '+e.message,'e');});
};

tk.onclick=function(){
 var t=tx.value.trim();
 tx.value='';
 processText(t);
};

tx.onkeydown=function(e){
 if(e.key=='Enter'){tk.click();}
};


</script>
</body>
</html>
