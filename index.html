<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>KIRO v7</title>
<style>
:root{--b:#00ff41}
*{margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;color:var(--b);font-family:'Courier New',monospace;overflow:hidden}
canvas{position:absolute;top:0;left:0;z-index:1;opacity:0.3;pointer-events:none}
.ui{position:relative;z-index:99;width:100%;height:100dvh;padding:15px;display:flex;flex-direction:column;background:rgba(0,0,0,0.4)}
.hdr{text-align:center;font-size:0.7rem;letter-spacing:3px;text-shadow:0 0 5px var(--b);margin-bottom:5px}
.st{border:1px solid var(--b);padding:6px 12px;background:rgba(0,20,0,0.7);font-size:0.7rem;font-weight:bold;letter-spacing:1px;box-shadow:0 0 10px rgba(0,255,65,0.3);text-align:center;margin-bottom:5px}
.lg{width:100%;flex:1;background:rgba(0,0,0,0.85);border-left:2px solid var(--b);padding:5px 8px;font-size:0.6rem;color:#aaa;overflow-y:auto;line-height:1.2;white-space:pre-wrap;word-break:break-all}
.lg .s{color:var(--b)}
.lg .e{color:#f44}
.lg .y{color:#ff0}
.lg .a{color:#0ff}
#b{width:100%;padding:12px;margin-top:5px;background:transparent;color:var(--b);border:2px solid var(--b);font-size:0.9rem;font-weight:bold;letter-spacing:3px;cursor:pointer;text-transform:uppercase;z-index:999}
#b:active{background:var(--b);color:#000}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="ui">
<div class="hdr"><span class="s">[ KIRO v7 - DEBUG LIVE ]</span></div>
<div class="st" id="st">SIGNAL_STDBY</div>
<div class="lg" id="lg"><span class="s">Tap tombol, Kiro dengerin, Kiro jawab.</span></div>
<button id="b">ENTER & NGOMONG</button>
<div id="txtWrap" style="display:none;width:100%;margin-top:5px">
<input id="txt" type="text" placeholder="Ketik pesan..." style="width:80%;padding:10px;background:#000;color:#0f0;border:1px solid #0f0;font-size:14px;outline:none">
<button id="snd" style="width:18%;padding:10px;background:transparent;color:#0f0;border:1px solid #0f0;font-size:14px">KIRIM</button>
</div>
</div>
<script>
var cv=document.getElementById('cv'),cx=cv.getContext('2d');
cv.width=innerWidth;cv.height=innerHeight;
var ch='ã‚¢ã‚¤ã‚¦ã‚¨ã‚ª0123456789XYZ',fs=10,cc=cv.width/fs,d=[];
for(var i=0;i<cc;i++)d[i]=1;
setInterval(function(){
 cx.fillStyle='rgba(0,0,0,0.05)';cx.fillRect(0,0,cv.width,cv.height);
 cx.fillStyle='#0f0';cx.font=fs+'px monospace';
 for(var i=0;i<d.length;i++){cx.fillText(ch[Math.floor(Math.random()*ch.length)],i*fs,d[i]*fs);if(d[i]*fs>cv.height&&Math.random()>0.975)d[i]=0;d[i]++}
},30);

var st=document.getElementById('st'),lg=document.getElementById('lg'),b=document.getElementById('b');
var KEY='sk-e6063277741f42f7a3df40a2896de212';
var URL='https://api.deepseek.com/v1/chat/completions';
var SYS='Kamu Kiro, asisten Bang Giri. Panggil Bang. Jawab natural seperti ngobrol teman. Santai, hangat, suka bercanda. JANGAN kaku. JANGAN emoji. Jangan pake kata-kata sales. Jangan tanya ada yang bisa dibantu.';
var busy=0,rec=null,txtInput=null;

function L(m,cls){
 var d=new Date();
 var t=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2);
 lg.innerHTML+='\n<span class="'+(cls||'s')+'">['+t+']> </span>'+m;
 lg.scrollTop=lg.scrollHeight;
}
function face(s,c){st.innerText=s;st.style.color=c;st.style.borderColor=c;}

async function sendAPI(t){
 L('DeepSeek: mengirim "'+t.substring(0,30)+'..."','y');
 try{
  var r=await fetch(URL,{
   method:'POST',
   headers:{'Content-Type':'application/json','Authorization':'Bearer '+KEY},
   body:JSON.stringify({model:'deepseek-chat',messages:[{role:'system',content:SYS},{role:'user',content:t}],max_tokens:300})
  });
  L('DeepSeek: status '+r.status,'y');
  var d=await r.json();
  var reply=d.choices&&d.choices[0]?d.choices[0].message.content:'Error';
  L('DeepSeek: reply '+reply.substring(0,30),'y');
  return reply;
 }catch(e){
  L('DeepSeek ERROR: '+e.message,'e');
  return 'Jalur error';
 }
}

function speak(t){
 var ct=t.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu,'').replace(/[_#*`\n\r]/g,' ');
 L('TTS: "'+(ct.substring(0,30))+'..."','a');
 var u=new SpeechSynthesisUtterance(ct);
 u.lang='id-ID';
 u.onstart=function(){L('TTS: mulai bicara','a');face('KIRO BICARA','#0ff');};
 u.onend=function(){L('TTS: selesai','a');busy=0;face('SIAP','#0f0');};
 u.onerror=function(e){L('TTS ERROR: '+e.error,'e');busy=0;face('SIGNAL_STDBY','#0f0');};
 window.speechSynthesis.speak(u);
}

function startRec(){
 if(!('webkitSpeechRecognition'in window)&&!('SpeechRecognition'in window)){
  L('BROWSER: tidak support SpeechRecognition','e');return;
 }
 var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 rec=new SR();
 L('SpeechRecognition: objek baru dibuat','s');
 rec.continuous=true;rec.interimResults=true;rec.lang='id-ID';
 
 rec.onstart=function(){
  L('rec.onstart: microphone aktif, mulai dengar','s');
  face('DENGAR...','#ff0');
 };
 
 rec.onresult=function(e){
  for(var i=e.resultIndex;i<e.results.length;i++){
   var t=e.results[i][0].transcript;
   var f=e.results[i].isFinal?'FINAL':'interim';
   L('rec.onresult['+i+']: '+f+' "'+t+'"','y');
   if(f=='FINAL'&&t.trim()&&!busy){
    busy=1;
    L('=== PROSES SUARA ===','s');
    face('MIKIR...','#ffcc00');
    try{rec.stop();L('rec.stop: ok','s');}catch(e){L('rec.stop err: '+e.message,'e');}
    sendAPI(t).then(function(reply){
     ai(reply);
     speak(reply);
    });
   }
  }
 };
 
 rec.onerror=function(e){
  L('rec.onerror: '+e.error+(e.message?': '+e.message:''),'e');
  if(!busy){face('SIGNAL_STDBY','#0f0');}
 };
 
 rec.onend=function(){
  L('rec.onend: microphone dimatikan','s');
  if(!busy){face('SIGNAL_STDBY','#0f0');}
 };
 
 L('rec.start: memanggil...','s');
 try{
  rec.start();
  L('rec.start: sukses dipanggil','s');
 }catch(e){
  L('rec.start CRASH: '+e.message+'\\n'+e.stack,'e');
  face('SIGNAL_STDBY','#0f0');
 }
}

function ai(reply){
 var clean=reply.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu,'');
 L('[KIRO] '+clean.substring(0,100),'a');
}

setTimeout(function(){txtInput=document.getElementById('txt');document.getElementById('snd').onclick=function(){if(busy||!txtInput.value.trim())return;var t=txtInput.value;txtInput.value='';you(t);busy=1;face('MIKIR...','#ffcc00');sendAPI(t).then(function(reply){ai(reply);face('KIRO BICARA','#00ffff');speak(reply);});};},100);

b.onclick=function(){
 if(busy){L('Tombol ditekan tapi busy','y');return;}
 L('=== TOMBOL DITEKAN ===','s');
 navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
  L('getUserMedia: izin mic dapat','s');
  stream.getTracks().forEach(function(t){t.stop();});
  L('getUserMedia: track ditutup','s');
  startRec();
 }).catch(function(e){
  L('getUserMedia GAGAL: '+e.message,'e');
 });
};

window.onerror=function(m,src,line,col,err){
 L('GLOBAL ERROR: '+(m||'')+' di '+line+':'+col,'e');
 return true;
};

L('HTML loaded: '+navigator.userAgent.substring(0,50),'s');
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
L('SpeechRecognition available: '+(!!SR),'s');
L('SpeechSynthesis available: '+('speechSynthesis'in window),'s');
L('SELESAI INIT. Tekan tombol.','s');
// Cek iPhone
if(/iPhone|iPad|iPod/i.test(navigator.userAgent)){
 L('iPhone terdeteksi - aktifkan text input','y');
 document.getElementById('txtWrap').style.display='flex';
}
</script>
</body>
</html>
