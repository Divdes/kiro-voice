<!DOCTYPE html>
<html lang="id">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
 <title>MATRIX_CONSCIOUSNESS_v5.0</title>
 <style>
 :root {
 --matrix-bright: #00ff41;
 --matrix-dark: #003b00;
 --bg-pure: #000000;
 }
 body, html {
 margin: 0;
 padding: 0;
 width: 100%;
 height: 100%;
 background-color: var(--bg-pure);
 font-family: 'Courier New', Courier, monospace;
 overflow: hidden;
 box-sizing: border-box;
 }
 canvas {
 position: absolute;
 top: 0;
 left: 0;
 width: 100%;
 height: 100%;
 z-index: 1;
 opacity: 0.35;
 pointer-events: none;
 }
 .interface-layer {
 position: relative;
 z-index: 99;
 width: 100%;
 height: 100%;
 padding: 15px;
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: space-between;
 box-sizing: border-box;
 background: rgba(0, 0, 0, 0.4);
 }
 .matrix-header {
 font-size: 0.7rem;
 color: var(--matrix-bright);
 letter-spacing: 3px;
 text-shadow: 0 0 5px var(--matrix-bright);
 }
 .status-node {
 border: 1px solid var(--matrix-bright);
 padding: 8px 15px;
 background: rgba(0, 20, 0, 0.7);
 color: var(--matrix-bright);
 font-size: 0.8rem;
 font-weight: bold;
 letter-spacing: 1px;
 box-shadow: 0 0 10px rgba(0, 255, 65, 0.3);
 text-transform: uppercase;
 }
 .matrix-console {
 width: 100%;
 height: 90px;
 background: rgba(0, 0, 0, 0.85);
 border-left: 2px solid var(--matrix-bright);
 padding: 8px;
 font-size: 0.7rem;
 color: #ffffff;
 box-sizing: border-box;
 overflow-y: auto;
 text-align: left;
 line-height: 1.3;
 }
 .matrix-console span.accent {
 color: var(--matrix-bright);
 text-shadow: 0 0 3px var(--matrix-bright);
 }
 #matrixBtn {
 width: 100%;
 padding: 12px;
 background: transparent;
 color: var(--matrix-bright);
 border: 1px solid var(--matrix-bright);
 font-family: 'Courier New', monospace;
 font-size: 0.8rem;
 font-weight: bold;
 letter-spacing: 2px;
 cursor: pointer;
 text-transform: uppercase;
 box-shadow: 0 0 8px rgba(0, 255, 65, 0.4);
 z-index: 999;
 position: relative;
 }
 #matrixBtn:active {
 background: var(--matrix-bright);
 color: var(--bg-pure);
 box-shadow: 0 0 20px var(--matrix-bright);
 }
 </style>
</head>
<body>
 <canvas id="matrixCanvas"></canvas>
 <div class="interface-layer">
 <div class="matrix-header">[CON_LINK: KIRO_CORE]</div>
 <div class="status-node" id="status-display">SIGNAL_STDBY</div>
 <div class="matrix-console" id="log-box">
 <span class="accent">[SYS]></span> Siap menjalin koneksi pikiran nirkabel...
 </div>
 <button id="matrixBtn">ENTER_THE_MATRIX</button>
 </div>

 <script>
// DEEPSEEK API LANGSUNG
const API_KEY = "sk-e6063277741f42f7a3df40a2896de212";
const API_URL = "https://api.deepseek.com/v1/chat/completions";
const SYS_PROMPT = "Kamu Kiro, asisten Bang Giri. Panggil Bang. Jawab singkat hangat. JANGAN pake emoji.";

// --- 1. MATRIX CANVAS ---
const canvas = document.getElementById('matrixCanvas');
const ctx = canvas.getContext('2d');
function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}
resizeCanvas();
const chars="アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモ1234567890XYZ";
const fontSize=10;
const columns=canvas.width/fontSize;
const rainDrops=Array(Math.floor(columns)).fill(1);
setInterval(function(){
 ctx.fillStyle='rgba(0,0,0,0.05)';ctx.fillRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle='#0f0';ctx.font=fontSize+'px monospace';
 for(var i=0;i<rainDrops.length;i++){
  ctx.fillText(chars[Math.floor(Math.random()*chars.length)],i*fontSize,rainDrops[i]*fontSize);
  if(rainDrops[i]*fontSize>canvas.height&&Math.random()>0.975)rainDrops[i]=0;
  rainDrops[i]++;
 }
},30);

// --- 2. CORE ---
var sd=document.getElementById('status-display');
var lb=document.getElementById('log-box');
var btn=document.getElementById('matrixBtn');
var rec=null;
var speaking=0;
var micOk=0;

function us(t,c){sd.innerText=t;sd.style.color=c;sd.style.borderColor=c;}
function log(m){lb.innerHTML+='<br><span class="accent">[SYS]></span> '+m;lb.scrollTop=lb.scrollHeight;}
function you(m){lb.innerHTML+='<br><span class="accent">[YOU]></span> '+m;lb.scrollTop=lb.scrollHeight;}
function ai(m){lb.innerHTML+='<br><span class="accent">[AI]></span> '+m;lb.scrollTop=lb.scrollHeight;}

async function sendAPI(t){
 try{
  var r=await fetch(API_URL,{
   method:'POST',
   headers:{'Content-Type':'application/json','Authorization':'Bearer '+API_KEY},
   body:JSON.stringify({model:'deepseek-chat',messages:[{role:'system',content:SYS_PROMPT},{role:'user',content:t}],max_tokens:300})
  });
  var d=await r.json();
  return d.choices&&d.choices[0]?d.choices[0].message.content:'Error';
 }catch(e){return 'Jalur data terputus.';}
}

function speak(t){
 var ct=t.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu,'').replace(/[\n\r_#*`]/g,' ');
 if(!ct.trim())ct='Tidak ada respon.';
 var u=new SpeechSynthesisUtterance(ct);
 u.lang='id-ID';
 u.onend=function(){speaking=0;us('STREAM_RECV','#0f0');if(rec)rec.start();};
 window.speechSynthesis.speak(u);
}

// VOICE REC - PERTAMA minta izin mic dulu
function initVoice(){
 navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
  s.getTracks().forEach(function(t){t.stop();});
  micOk=1;
  log('Mic terhubung');
  
  if('webkitSpeechRecognition' in window||'SpeechRecognition' in window){
   var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
   rec=new SR();
   rec.continuous=false;rec.interimResults=false;rec.lang='id-ID';
   rec.onstart=function(){if(!speaking)us('STREAM_RECV','#0f0');};
   rec.onerror=function(e){if(e.error!='no-speech')us('SIGNAL_ERR','#ff003c');};
   rec.onend=function(){
    if(!speaking){us('SIGNAL_STDBY','#0f0');}
   };
   rec.onresult=async function(e){
    var t=e.results[e.results.length-1][0].transcript;
    if(t.trim()){
     you(t);
     speaking=1;
     us('TRANS_COMP','#ffcc00');
     if(rec)rec.stop();
     var reply=await sendAPI(t);
     ai(reply);
     us('ORACLE_OUT','#00ffff');
     speak(reply);
    }
   };
   log('Voice siap. Tekan ENTER_THE_MATRIX');
  }else{
   log('Browser gak support voice');
  }
 }).catch(function(e){log('Mic ditolak: '+e.message);});
}

btn.onclick=function(){
 btn.style.display='none';
 log('Gerbang nirkabel aktif. Silahkan bicara...');
 if(!micOk){
  initVoice();
 }else if(rec){
  rec.start();
 }
};

window.onerror=function(m){log((m||'').toString());return true};
 </script>
</body>
</html>
